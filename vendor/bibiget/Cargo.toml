[package]
name = "bibiget"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
indicatif = "0.18"
percent-encoding = "2.3"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls", "stream", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
