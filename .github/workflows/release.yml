name: Desktop and Android release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (must already exist to publish)
        default: v2.3.0
        required: true
      publish:
        description: Publish all packages after successful builds
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test independent applications
        shell: pwsh
        run: |
          cargo test --manifest-path desktop/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          cargo test --manifest-path mobile/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { throw 'Mobile tests failed' }

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x86_64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-latest
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - name: Build desktop
        run: cargo build --manifest-path desktop/Cargo.toml --release --locked
      - name: Package Windows with speech runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-desktop.ps1
      - name: Package macOS or Linux with speech runtime
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.pkg
            dist/*.dmg
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  android:
    if: github.event_name != 'pull_request'
    needs: test
    defaults:
      run:
        working-directory: mobile
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            ndk: '30.0.16248370'
          - abi: armeabi-v7a
            ndk: '30.0.16248370'
          - abi: x86
            ndk: '26.1.10909125'
          - abi: x86_64
            ndk: '26.1.10909125'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android NDK
        shell: pwsh
        run: |
          $manager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $manager --install 'ndk;${{ matrix.ndk }}'
          if ($LASTEXITCODE -ne 0) { throw 'Android NDK installation failed' }

      - name: Restore update-compatible signing key
        shell: pwsh
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if (-not $env:ANDROID_DEBUG_KEYSTORE_B64) { throw 'Missing ANDROID_DEBUG_KEYSTORE_B64 secret' }
          $keyPath = Join-Path $env:USERPROFILE '.android\debug.keystore'
          New-Item -ItemType Directory -Force -Path (Split-Path $keyPath) | Out-Null
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ANDROID_DEBUG_KEYSTORE_B64))
          $fingerprint = ((& keytool -list -v -keystore $keyPath -storepass android -alias androiddebugkey |
            Select-String 'SHA256:' | Select-Object -First 1).ToString() -split 'SHA256:')[-1].Trim().Replace(':', '').ToLowerInvariant()
          if ($fingerprint -ne '4ca9f4bbcc644087234912bd967be9b2b68f5d8cd7cf1d77fb1b26a01a47d473') {
            throw 'Signing key does not match existing Android installation'
          }

      - name: Build signed APK
        shell: pwsh
        run: |
          $cmakeBin = Split-Path (Get-Command cmake.exe).Source
          $ninjaBin = Split-Path (Get-Command ninja.exe).Source
          & ./scripts/build-android.ps1 `
            -Abi '${{ matrix.abi }}' `
            -SdkRoot $env:ANDROID_HOME `
            -Ndk30 (Join-Path $env:ANDROID_HOME 'ndk\30.0.16248370') `
            -Ndk26 (Join-Path $env:ANDROID_HOME 'ndk\26.1.10909125') `
            -JdkRoot $env:JAVA_HOME `
            -CmakeBin $cmakeBin `
            -NinjaBin $ninjaBin
          if ($LASTEXITCODE -ne 0) { throw 'Android build failed' }

      - name: Verify ABI splits and signatures
        shell: pwsh
        run: |
          $aapt = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0\aapt.exe'
          $signer = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0\apksigner.bat'
          $abi = '${{ matrix.abi }}'
          $apk = Join-Path 'dist' "bibiocr-mobile-v0.1.6-$abi.apk"
          if (-not (Test-Path $apk)) { throw "Missing $apk" }
          $badging = & $aapt dump badging $apk
          if ($LASTEXITCODE -ne 0 -or -not ($badging -contains "native-code: '$abi'")) {
            throw "Incorrect native ABI in $apk"
          }
          if (-not ($badging -match "versionCode='16777479'")) {
            throw "APK would not upgrade the installed app: $apk"
          }
          $certificate = & $signer verify --print-certs $apk
          if ($LASTEXITCODE -ne 0 -or -not ($certificate -contains 'Signer #1 certificate SHA-256 digest: 4ca9f4bbcc644087234912bd967be9b2b68f5d8cd7cf1d77fb1b26a01a47d473')) {
            throw "Incorrect signature in $apk"
          }
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$abi $hash" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: bibiocr-apk-${{ matrix.abi }}
          path: mobile/dist/bibiocr-mobile-v0.1.6-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 14


  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [test, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify assets and include corresponding source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          for asset in bibiocr-2.3.0-windows-x86_64.zip bibiocr-2.3.0-arm64-macOS.zip bibiocr-2.3.0-x86_64-macOS.zip bibiocr-2.3.0-linux-x86_64.tar.gz bibiocr-2.3.0-linux-aarch64.tar.gz; do test -s "dist/$asset"; done
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          git archive --format=tar.gz --prefix="bibiocr-$RELEASE_TAG/" -o "dist/bibiocr-$RELEASE_TAG-source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "BIBIOCR $RELEASE_TAG — Desktop + Android" --notes-file .github/release-notes.md
