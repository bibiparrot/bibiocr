[package]
name = "bibiocr"
version = "2.2.3"
edition = "2024"
description = "A cross-platform OCR desktop utility built with egui"
license = "MIT"
build = "build.rs"

[dependencies]
arboard = "3.6"
anydoc = "0.2.4"
base64 = "0.22"
bibiget = { path = "src/tools/bibiget" }
cxx = "1.0"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_commonmark = { version = "0.25.0", default-features = false, features = ["load-images", "pulldown_cmark"] }
egui_dock = "0.21.1"
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
pandoc = "0.8.11"
pdf-inspector = { version = "=1.15.0", default-features = false, features = ["render-pdfium"] }
rfd = "0.15.4"
pulldown-cmark = "0.13.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
toml = "0.9"
tokio = { version = "1", features = ["net", "rt", "time"] }
ureq = "3.4"

[build-dependencies]
cxx-build = "1.0"
winresource = "0.1.28"

[dev-dependencies]
ttf-parser = "0.25"

[patch.crates-io]
# Keep the upstream API while suppressing the console window created by the
# Pandoc child process on Windows. See src/tools/pandoc/src/lib.rs.
pandoc = { path = "src/tools/pandoc" }

[profile.release]
lto = "thin"
opt-level = 3
strip = true
