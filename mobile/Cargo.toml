[package]
name = "bibiocr-mobile"
version = "0.1.6"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[lib]
name = "bibiocr_mobile"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bibiocr-mobile"
path = "src/main.rs"

[dependencies]
egui_extras = { version = "0.36.1", default-features = false, features = ["syntect"] }
htmd = "=0.5.5"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls", "api-27"] }
oar-ocr = { version = "=0.9.2", default-features = false }
pulldown-cmark = "0.13"
robius-file-picker = "0.3.1"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
sys-locale = "0.3"
toml = "0.9"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
voice-g2p = "=0.2.2"
zip = { version = "6.0.0", default-features = false }
wsola = "=0.1.0"

[build-dependencies]
android-build = "0.1.4"

[patch.crates-io]
oar-ocr = { path = "vendor/oar-ocr" }
robius-android-env = { path = "vendor/robius-android-env" }
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }
winit = { path = "vendor/winit-0.30.13" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["game-activity"] }
encoding_rs = "0.8"
eframe = { version = "0.36.1", default-features = false, features = ["android-game-activity", "default_fonts", "glow"] }
jni = "0.21"
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["android-shared-stdcxx", "mtmd"] }
robius-android-env = "0.2.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }

[package.metadata.android]
package = "com.bibiocr.mobile"
apk_name = "bibiocr-mobile"
build_targets = ["aarch64-linux-android"]
resources = "android-res"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 27
target_sdk_version = 37

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "BIBIOCR"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|density"
orientation = "portrait"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 28

[profile.release]
lto = "thin"
opt-level = 3
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
